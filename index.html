<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>らーめん羅針盤</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Google マップ（モバイル / Web）の見た目と動きに寄せた UI */
:root{
  --blue:#1a73e8; --blue-soft:#e8f0fe; --red:#ea4335;
  --text:#202124; --text-2:#5f6368; --line:#dadce0; --bg:#fff; --bg-2:#f1f3f4;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --shadow-up:0 -1px 3px rgba(60,64,67,.2),0 -4px 12px rgba(60,64,67,.12);
  --ease:cubic-bezier(.2,0,0,1);           /* Material emphasized */
  --f:"Roboto","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --top:calc(env(safe-area-inset-top,0px) + 112px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:#e5e3df;color:var(--text);font-size:14px;overflow:hidden;overscroll-behavior:none}
#map{position:fixed!important;inset:0;width:100%;height:100%;z-index:0}
button{font:inherit;color:inherit}

/* ---- 検索ボックス + チップ ---- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0;pointer-events:none;transition:transform .3s var(--ease),opacity .2s}
.top.hide{transform:translateY(-130%);opacity:0}
.search{pointer-events:auto;margin:0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;height:48px;background:var(--bg);border-radius:24px;box-shadow:var(--shadow);padding:0 6px 0 14px;gap:8px}
.search .logo{width:26px;height:26px;border-radius:50%;flex:none;background:#fff url(icon.png) center/cover;box-shadow:0 0 0 1px var(--line)}
#q{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--text);outline:none;height:100%}
#q::placeholder{color:var(--text-2)}
#q::-webkit-search-cancel-button{display:none}
.round{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none}
.round:active{background:var(--bg-2)}
.round svg{width:22px;height:22px}
#clearQ{display:none}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px)) 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;border:0;background:var(--bg);border-radius:16px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);white-space:nowrap;transition:background .15s,color .15s;scroll-snap-align:start}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:#d3e3fd;color:#041e49}
.chip:active{background:var(--bg-2)}

/* ---- このエリアを検索 ---- */
#reSearch{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 116px);z-index:19;transform:translate(-50%,-8px) scale(.9);opacity:0;pointer-events:none;border:0;background:var(--bg);color:var(--blue);font-weight:500;height:36px;border-radius:18px;padding:0 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;cursor:pointer;transition:transform .25s var(--ease),opacity .2s}
#reSearch.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#reSearch svg{width:18px;height:18px}

/* ---- 右下 FAB（現在地） ---- */
.fabs{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:25;display:flex;flex-direction:column;gap:12px;transition:transform .35s var(--ease),opacity .2s;will-change:transform}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.fab svg{width:24px;height:24px}
.fab.on{color:var(--blue)}
.fab:active{background:var(--bg-2)}

/* ---- ボトムシート（指に追従して3段スナップ） ---- */
.sheet{position:fixed;left:0;right:0;top:0;height:100%;z-index:30;background:var(--bg);border-radius:28px 28px 0 0;box-shadow:var(--shadow-up);display:flex;flex-direction:column;will-change:transform;touch-action:none}
.sheet.anim{transition:transform .38s var(--ease)}
.handle{flex:none;padding:10px 16px 4px;cursor:grab}
.handle::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:#c4c7c5;margin:0 auto 10px}
.shead{display:flex;align-items:center;gap:8px;padding:0 16px}
.shead h2{margin:0;font-size:18px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead small{color:var(--text-2);font-size:13px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;height:32px;border:1px solid #747775;background:var(--bg);border-radius:8px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;color:#444746}
.fchip[aria-pressed="true"]{background:#c2e7ff;border-color:#c2e7ff;color:#001d35}
.fchip select{border:0;background:transparent;font:inherit;color:inherit;outline:none;padding:0;cursor:pointer}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:pan-y}
.item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid #e9eaeb;cursor:pointer;transition:background .15s}
.item:active,.item.hl{background:var(--bg-2)}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:16px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{color:var(--text-2);font-size:14px;line-height:1.5;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-2);display:inline-block;margin:0 2px}
.open{color:#188038;font-weight:500}.closed{color:#d93025;font-weight:500}
.thumb{width:84px;height:84px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;overflow:hidden;position:relative}
.thumb img,.gal img,.mk .c img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.gal:empty{display:none}
.gal{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px 0 0;padding:0 16px 4px;scrollbar-width:none;height:184px}
.gal::-webkit-scrollbar{display:none}
.gal>div{flex:none;height:180px;border-radius:8px;overflow:hidden;scroll-snap-align:start;background:var(--bg-2);position:relative}
.gal>div:first-child{width:62%;min-width:220px}.gal>div{width:132px}
.gal small{position:absolute;left:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 0 3px #000;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk{background:linear-gradient(90deg,#eceff1 25%,#f6f7f8 50%,#eceff1 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.menu{display:flex;gap:8px;flex-wrap:wrap;padding:4px 16px 8px}
.menu span{background:#fef7e0;color:#7a4f01;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.sec{font-size:16px;font-weight:500;padding:14px 16px 4px}
.abura{display:inline-flex;gap:2px;vertical-align:middle}
.abura b{width:7px;height:7px;border-radius:50%;background:#dadce0}
.abura b.on{background:#f29900}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--bg-2);color:var(--text-2)}
.tag.ok{background:#e6f4ea;color:#137333}
.sheet.det .shead,.sheet.det .filters{display:none}
.sheet.det .handle{padding-bottom:0}
.empty{padding:32px 24px;color:var(--text-2);text-align:center;line-height:1.7}

/* ---- 場所の詳細 ---- */
.pl{padding:0 0 16px;position:relative}
.pl h1{padding-right:44px}
.pl h1{font-size:22px;font-weight:400;margin:2px 16px 4px;line-height:1.3}
.pl .line{padding:0 16px}
.acts{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:none;height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer;border:0;background:#c2e7ff;color:#001d35}
.act.pri{background:#0b57d0;color:#fff}
.act svg{width:18px;height:18px}
.rows{border-top:1px solid #e9eaeb;margin-top:4px}
.row{display:flex;gap:20px;align-items:flex-start;padding:14px 16px;font-size:14px;line-height:1.5}
.row svg{width:22px;height:22px;flex:none;color:var(--blue)}
.row a{color:var(--text);text-decoration:none;overflow-wrap:anywhere}
.row>div{min-width:0}
.note{font-size:12px;color:var(--text-2);line-height:1.6;padding:8px 16px}
.closeX{position:absolute;right:12px;top:-4px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg-2);display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.closeX svg{width:20px;height:20px}

/* ---- 地図上のピン ---- */
.mk{margin:-11px 0 0 -11px;display:flex;align-items:center;transform-origin:50% 50%;animation:pop .22s var(--ease) both;cursor:pointer}
.mk .c{width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk .lb{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:500;white-space:nowrap;color:#3c4043;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;pointer-events:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:none}
.showlb .mk .lb{display:block}
.mk.ph{margin:-21px 0 0 -21px}.mk.ph .c{width:42px;height:42px;border:2px solid #fff;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.4)}.mk.ph .lb{left:46px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 選択中: 赤い大きなピンが落ちてきて弾む */
.pin{margin:-52px 0 0 -20px;width:40px;height:52px;transform-origin:50% 100%;animation:drop .5s cubic-bezier(.3,1.5,.6,1) both}
.pin svg{width:40px;height:52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pin span{position:absolute;left:0;right:0;top:9px;text-align:center;color:#fff;font-weight:700;font-size:14px}
@keyframes drop{0%{transform:translateY(-40px) scale(.6);opacity:0}60%{transform:translateY(0) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1)}}
/* 現在地: 青い点＋ゆっくり脈打つ輪 */
.me{margin:-12px 0 0 -12px;width:24px;height:24px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);position:relative}
.me::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(66,133,244,.25);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;z-index:60;background:#323232;color:#fff;padding:14px 16px;border-radius:4px;font-size:14px;max-width:min(560px,92vw);box-shadow:var(--shadow);transition:transform .25s var(--ease),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1}
.cover{position:fixed;inset:0;z-index:70;background:#fff;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-2);line-height:1.8}

/* ---- PC: 左サイドパネル（Google マップ Web 版の配置） ---- */
@media (min-width:900px){
  .top{left:0;right:auto;width:408px;padding-top:12px;z-index:35}
  .search{margin:0 12px 0 16px}
  .chips{position:fixed;left:432px;right:0;top:12px;padding:6px 16px}
  .sheet{left:0;right:auto;width:408px;top:0;height:100%;transform:none!important;border-radius:0;box-shadow:0 0 20px rgba(0,0,0,.18);padding-top:76px}
  .handle::before{display:none}
  .fabs{bottom:24px!important;transform:none!important}
  #reSearch{left:calc(50% + 204px);top:64px}
  .toast{left:calc(50% + 204px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  d.innerHTML=`<svg viewBox="0 0 40 52"><path fill="${col}" stroke="#b31412" stroke-width="1" d="M20 1C9.5 1 1 9.4 1 19.8 1 33.6 20 51 20 51s19-17.4 19-31.2C39 9.4 30.5 1 20 1z"/></svg><span>${ch}</span>`;return d}
function galHTML(v){
  if(!v) return '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';   // 読み込み中（Google と同じくグレーのプレースホルダ）
  if(!v.u||!v.u.length) return '';
  return v.u.map((u,i)=>`<div>${imgTag(u)}${v.a[i]?'<small>📷 '+esc(v.a[i])+'</small>':''}</div>`).join('');
}
function openDetail(r,fromMap){
  sel=r; sheet.classList.add('det');
  if(selMarker) selMarker.setMap(null);
  if(map){
    selMarker=new AdvMarker({map,position:{lat:r[4],lng:r[5]},content:selPinEl(r),zIndex:999,title:r[0]});
    if(markers.has(r[19])) markers.get(r[19]).setMap(null);
    // ピンがシートに隠れないよう、見えている地図領域の中央へ滑らかに移動
    const target={lat:r[4],lng:r[5]};
    if(!fromMap && map.getZoom()<16) map.setZoom(16);
    map.panTo(target);
    setTimeout(()=>isDesk()?map.panBy(-204,0):map.panBy(0,(innerHeight-snaps()[1])/2),0);
  }
  const o=here||anchor; const dk=o?km(o.lat,o.lng,r[4],r[5]):null, op=openNow(r[13]);
  const dest=r[4]+','+r[5], qname=encodeURIComponent(r[0]+' '+(r[1]||'')+' '+r[2]+r[3]);
  const gm=`https://www.google.com/maps/search/?api=1&query=${qname}`;
  const rowsHTML=[
    [ICON.bowl,`${esc(r[6]||'系統不明')}${r[7]?'（'+esc(r[7].replace(/;/g,'・'))+'）':''}${r[8]?'<br>こってり度 '+abura(r[8])+' '+r[8]+'/5':''}${r[9]?'<br><span style="color:var(--text-2)">'+esc(r[9].replace(/;/g,'・'))+'</span>':''}`],
    r[11]&&[ICON.info,'麺：'+esc(r[11])],
    [ICON.pin,`<a href="${gm}" target="_blank" rel="noopener">${esc(r[17]||r[2]+r[3])}</a>`],
    r[13]&&[ICON.clock,(op===true?'<span class="open">営業中</span> ・ ':op===false?'<span class="closed">営業時間外</span> ・ ':'')+esc(r[13])],
    r[14]&&[ICON.web,`<a href="${esc(r[14])}" target="_blank" rel="noopener">${esc(r[14].replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a>`],
    r[18]&&[ICON.call,`<a href="tel:${esc(r[18])}">${esc(r[18])}</a>`],
  ].filter(Boolean).map(([i,t])=>`<div class="row">${i}<div>${t}</div></div>`).join('');
  body.innerHTML=`<div class="pl">
    <button class="closeX" id="closeX" aria-label="閉じる">${ICON.x}</button>
    <h1>${esc(r[0])}${r[1]?' <span style="font-size:16px;color:var(--text-2)">'+esc(r[1])+'</span>':''}</h1>
    <div class="line">${r[8]?abura(r[8])+'<span class="dot"></span>':''}ラーメン店<span class="dot"></span>${esc(r[6]||'系統不明')}${dk!=null?'<span class="dot"></span>'+fmtD(dk):''}</div>
    <div class="line" style="margin-top:2px"><span class="tag ${/^(A|B)/.test(r[12])?'ok':''}">${confLabel(r[12])}</span>${r[10]?'<span class="dot"></span>'+esc(r[10]):''}</div>
    <div class="gal" id="gal">${galHTML(photoCached(r))}</div>
    <div class="acts">
      <a class="act pri" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking">${ICON.dir}経路</a>
      <a class="act" target="_blank" rel="noopener" href="${gm}">${ICON.open}Google マップで開く</a>
      ${r[18]?`<a class="act" href="tel:${esc(r[18])}">${ICON.call}電話</a>`:''}
      <button class="act" id="shareB">${ICON.share}共有</button>
    </div>
    ${r[16]?`<div class="sec">メニュー</div><div class="menu">${r[16].split(/[;、,／/]/).filter(Boolean).slice(0,6).map(x=>'<span>'+esc(x.trim())+'</span>').join('')}</div>`:''}
    <div class="rows">${rowsHTML}</div>
    <p class="note">系統・営業状況は公開情報からの推定を含みます。口コミ・写真・最新の営業情報は「Google マップで開く」から確認できます。</p></div>`;
  body.scrollTop=0;
  if(!photoCached(r)) photoInfo(r).then(v=>{ if(sel===r && $('gal')) $('gal').outerHTML=`<div class="gal" id="gal">${galHTML(v||{u:[]})}</div>` });
  $('closeX').onclick=closeDetail;
  $('shareB').onclick=()=>{const d={title:r[0],text:r[0]+'（'+(r[6]||'ラーメン')+'）',url:gm}; navigator.share?navigator.share(d).catch(()=>{}):(navigator.clipboard.writeText(gm),toast('リンクをコピーしました'))};
  setSheet(1);
}
function closeDetail(){
  if(selMarker){selMarker.setMap(null);selMarker=null}
  sheet.classList.remove('det'); const r=sel; sel=null; if(r&&markers.has(r[19])) markers.get(r[19]).setMap(map);
  $('top').classList.remove('hide'); renderList(); setSheet(1);
}

/* ========== 現在地 ========== */
function locate(){
  if(!navigator.geolocation){toast('この端末では現在地が使えません');return}
  navigator.geolocation.getCurrentPosition(p=>{
    here={lat:p.coords.latitude,lng:p.coords.longitude}; anchor=here; $('locate').classList.add('on');
    if(map){
      if(meMarker) meMarker.setMap(null);
      const d=document.createElement('div'); d.className='me';
      meMarker=new AdvMarker({map,position:here,content:d,zIndex:1000,title:'現在地'});
      map.panTo(here); if(map.getZoom()<15) map.setZoom(15);
    }
    $('reSearch').classList.remove('on'); if(!sel) renderList();
  },()=>toast('現在地を取得できませんでした。地図を動かして「このエリアを検索」で探せます'),{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

/* ========== UI 配線 ========== */
function buildMoods(){
  const alias={"二郎":"二郎系","つけ麺":"魚介豚骨","辛い":"辛系","汁なし":"油そば・まぜそば","貝":"貝・海鮮","中華そば":"醤油","野菜":"タンメン・野菜"};
  $('moods').innerHTML=MOODS.map(([l,t])=>{const c=(CAT[t]||CAT[alias[t]]||[null])[0];return `<button class="chip" aria-pressed="false" data-t="${t}">${c?`<i style="background:${c}"></i>`:''}${l}</button>`}).join('');
  $('moods').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
    const t=b.dataset.t,on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); on?active.add(t):active.delete(t);
    if(sel) closeDetail(); else renderList(); drawMarkers(); if(snapIdx===0) setSheet(1)});
}
function toggle(id){const b=$(id);b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');if(sel)closeDetail();else renderList();drawMarkers()}
$('fOpen').onclick=()=>toggle('fOpen'); $('fSure').onclick=()=>toggle('fSure');
$('radius').onchange=()=>{if(sel)closeDetail();else renderList()};
let tmr; $('q').addEventListener('input',()=>{$('clearQ').style.display=$('q').value?'grid':'none';clearTimeout(tmr);tmr=setTimeout(()=>{if(sel)closeDetail();else renderList();drawMarkers()},250)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){$('q').blur();setSheet(1)}});
$('clearQ').onclick=()=>{$('q').value='';$('clearQ').style.display='none';renderList();drawMarkers()};
$('locate').onclick=locate;
$('reSearch').onclick=()=>{const c=map.getCenter();anchor={lat:c.lat(),lng:c.lng()};$('reSearch').classList.remove('on');$('locate').classList.remove('on');if(sel)closeDetail();else renderList();setSheet(1)};
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)closeDetail()});

setSheet(1,false); buildMoods();
initMap().catch(e=>console.warn(e)).finally(()=>{
  fetch('data.json').then(r=>r.json()).then(j=>{rows=j.rows;renderList();drawMarkers();locate()})
    .catch(()=>{body.innerHTML='<div class="empty">データを読み込めませんでした。電波の良い場所で再読み込みしてください。</div>'});
});
</script>
</body>
